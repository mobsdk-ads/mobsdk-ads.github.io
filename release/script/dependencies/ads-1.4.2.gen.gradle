// 广告配置文件，各个广告平台的依赖
def TRADPLUS = "tradplus"
def ADMOB = "admob"
def FACEBOOK = "facebook"
def APPLOVIN = "applovin"
def PANGLE = "pangle"
def UNITY = "unity"
def VUNGLE = "vungle"
def IRONSOURCE = "ironsource"
def MINTEGRAL = "mintegral"
def CHARTBOOST = "chartboost"
def FYBER = "fyber"
def BIGO = "bigo"
def YANDEX = "yandex"
def MYTARGET = "mytarget"
def BIDMACHINE = "bidmachine"
def SMAATO = "smaato"
def VERVE = "verve"
def TAURUSX = "taurusx"

def greenText(text) {
    try {
        return "\u001B[32m${text}\u001B[0m"
    } catch (Exception ignored) {
    }
    return text
}

def getUserSelectNetwork() {
    try {
        return project.ext.find('network')
    } catch (Exception ignored) {
    }
    return null
}

try {
    def userSelectNetwork = getUserSelectNetwork()
    if (userSelectNetwork != null && !userSelectNetwork.isEmpty()) {
        def projectName = String.format(Locale.US, "%s", project.name)
        println greenText("> Task :${projectName}:supportNetworkName() networkPlatform : " + userSelectNetwork)
    }
} catch (Exception ignored) {
}

def isContainPlatform(platform_array, platform) {
    try {
        if (platform_array != null && !platform_array.isEmpty()) {
            return platform_array.contains(platform)
        }
    } catch (Exception e) {
        println "platform_array error : " + e
    }
    return true
}
configurations.configureEach {
    exclude group: 'com.google.android.gms', module: 'play-services-ads'
    exclude group: 'com.google.android.gms', module: 'play-services-ads-lite'
}
dependencies {
